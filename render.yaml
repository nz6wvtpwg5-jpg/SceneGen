services:
  - type: pserv
    name: scenegen-api
    runtime: node
    plan: starter
    branch: Jon/Newstuff
    autoDeployTrigger: checksPass
    rootDir: backend
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: BACKEND_SERVICE_TOKEN
        sync: false
      - key: SCENEGEN_OAUTH_DROPTUNE_CLIENT_ID
        sync: false
      - key: SCENEGEN_OAUTH_DROPTUNE_CLIENT_SECRET
        sync: false
      - key: SCENEGEN_OAUTH_DROPTUNE_REDIRECT_URIS
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: SceneGen <support@scenegen.io>
      - key: EMAIL_REPLY_TO
        value: support@scenegen.io
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: CALENDAR_TOKEN_ENCRYPTION_KEY
        sync: false

  - type: web
    name: scenegen-web
    runtime: node
    plan: starter
    branch: Jon/Newstuff
    autoDeployTrigger: checksPass
    buildCommand: corepack enable && pnpm install --frozen-lockfile && NODE_OPTIONS=--max-old-space-size=4096 pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_HOSTPORT
        fromService:
          type: pserv
          name: scenegen-api
          property: hostport
      - key: BACKEND_SERVICE_TOKEN
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: COLLABORATOR_AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: SceneGen <support@scenegen.io>
      - key: EMAIL_REPLY_TO
        value: support@scenegen.io
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GEOAPIFY_API_KEY
        sync: false
