openapi: 3.0.0
info:
  title: SceneGen - New Entity Endpoints (FOR REVIEW)
  description: |
    Proposed API specification for new entity management endpoints.

    **STATUS: DRAFT - AWAITING BACKEND DEVELOPER APPROVAL**

    Please review and provide feedback:
    - Are these the right endpoints?
    - Is the structure correct?
    - Should anything be changed?
    - Do these align with your Azure architecture?

  version: 0.1.0-draft
  contact:
    name: Frontend Team
    email: jon@scenegen.io

servers:
  - url: https://scenegen-apim.azure-api.net/scenegen-api
    description: Azure Production (TO BE IMPLEMENTED)
  - url: http://localhost:3001/api
    description: Local Development (CURRENT IMPLEMENTATION)

paths:
  /user/entities:
    get:
      summary: Get user's entities
      description: |
        Returns all entities (artist or promoter profiles) owned by the authenticated user.

        **QUESTION FOR BACKEND:** Should this return an array or a single object?
        Current assumption: User can only have ONE entity, but returning array for flexibility.

      operationId: getUserEntities
      tags:
        - Entities
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Id
          in: header
          description: |
            User ID extracted from JWT token (temporary - should backend extract this?)
            **QUESTION:** Should backend extract user ID from JWT instead of requiring this header?
          required: false
          schema:
            type: string
            example: "31abcffb-6c8c-4988-bbbf-fd59350d4038"
      responses:
        '200':
          description: Success - Returns user's entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Entity'
              examples:
                singleEntity:
                  summary: User with one entity
                  value:
                    - id: "1f60064e-3dc6-4612-a5c4-2be834806277"
                      administrator_id: "31abcffb-6c8c-4988-bbbf-fd59350d4038"
                      entity_type: "artist"
                      name: "Jon Davis Band"
                      bio: "Rock band from California"
                      city: "San Francisco"
                      state: "California"
                      country: "USA"
                      latitude: 37.7749
                      longitude: -122.4194
                      created_at: "2026-02-01T13:48:01.620Z"
                      updated_at: "2026-02-01T13:48:01.620Z"
                noEntities:
                  summary: User with no entities
                  value: []
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /artist/add:
    post:
      summary: Create artist entity
      description: |
        Creates a new artist entity for the authenticated user.

        **BUSINESS RULE:** Currently enforces one entity per user (returns 409 if user already has entity).
        **QUESTION:** Is this the right business rule?

      operationId: createArtist
      tags:
        - Entities
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Id
          in: header
          description: |
            User ID extracted from JWT token (temporary - should backend extract this?)
            **QUESTION:** Should backend extract user ID from JWT instead?
          required: false
          schema:
            type: string
            example: "31abcffb-6c8c-4988-bbbf-fd59350d4038"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
            example:
              name: "Jon Davis Band"
              bio: "Rock band from California"
              city: "San Francisco"
              state: "California"
              country: "USA"
              latitude: 37.7749
              longitude: -122.4194
      responses:
        '201':
          description: Created - Artist entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
              example:
                id: "1f60064e-3dc6-4612-a5c4-2be834806277"
                administrator_id: "31abcffb-6c8c-4988-bbbf-fd59350d4038"
                entity_type: "artist"
                name: "Jon Davis Band"
                bio: "Rock band from California"
                city: "San Francisco"
                state: "California"
                country: "USA"
                latitude: 37.7749
                longitude: -122.4194
                created_at: "2026-02-01T13:48:01.620Z"
                updated_at: "2026-02-01T13:48:01.620Z"
        '400':
          description: Bad Request - Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Artist name is required"
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflict - User already owns an entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "CONFLICT"
                  message: "You already own an entity"
        '422':
          description: Unprocessable Entity - Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: "VALIDATION_ERROR"
                  message: "Invalid data provided"
        '500':
          $ref: '#/components/responses/ServerError'

  /promoter/add:
    post:
      summary: Create promoter entity
      description: |
        Creates a new promoter entity for the authenticated user.
        Same as /artist/add but with entity_type: "promoter"

        **BUSINESS RULE:** Currently enforces one entity per user (returns 409 if user already has entity).
        **QUESTION:** Is this the right business rule?

      operationId: createPromoter
      tags:
        - Entities
      security:
        - bearerAuth: []
      parameters:
        - name: X-User-Id
          in: header
          description: |
            User ID extracted from JWT token (temporary - should backend extract this?)
            **QUESTION:** Should backend extract user ID from JWT instead?
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntityRequest'
      responses:
        '201':
          description: Created - Promoter entity created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Conflict - User already owns an entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure AD B2C JWT token

  schemas:
    Entity:
      type: object
      description: Artist or Promoter entity
      required:
        - id
        - administrator_id
        - entity_type
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Unique entity identifier
          example: "1f60064e-3dc6-4612-a5c4-2be834806277"
        administrator_id:
          type: string
          description: User ID from Azure AD B2C (JWT 'oid' claim)
          example: "31abcffb-6c8c-4988-bbbf-fd59350d4038"
        entity_type:
          type: string
          enum: [artist, promoter]
          description: Type of entity
          example: "artist"
        name:
          type: string
          maxLength: 255
          description: Entity display name
          example: "Jon Davis Band"
        bio:
          type: string
          nullable: true
          description: Entity biography/description
          example: "Rock band from California"
        city:
          type: string
          maxLength: 100
          nullable: true
          description: Primary city location
          example: "San Francisco"
        state:
          type: string
          maxLength: 100
          nullable: true
          description: State/province
          example: "California"
        country:
          type: string
          maxLength: 100
          nullable: true
          description: Country
          example: "USA"
        latitude:
          type: number
          format: double
          nullable: true
          description: Location latitude (from Google Places)
          example: 37.7749
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          description: Location longitude (from Google Places)
          example: -122.4194
          minimum: -180
          maximum: 180
        created_at:
          type: string
          format: date-time
          description: Entity creation timestamp
          example: "2026-02-01T13:48:01.620Z"
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
          example: "2026-02-01T13:48:01.620Z"

    CreateEntityRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          description: Entity display name
          example: "Jon Davis Band"
        bio:
          type: string
          nullable: true
          description: Entity biography/description
          example: "Rock band from California"
        city:
          type: string
          maxLength: 100
          nullable: true
          description: Primary city location
          example: "San Francisco"
        state:
          type: string
          maxLength: 100
          nullable: true
          description: State/province
          example: "California"
        country:
          type: string
          maxLength: 100
          nullable: true
          description: Country
          example: "USA"
        latitude:
          type: number
          format: double
          nullable: true
          description: Location latitude (from Google Places)
          example: 37.7749
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          nullable: true
          description: Location longitude (from Google Places)
          example: -122.4194
          minimum: -180
          maximum: 180

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              description: Error code
              example: "VALIDATION_ERROR"
            message:
              type: string
              description: Human-readable error message
              example: "Artist name is required"
            details:
              type: string
              nullable: true
              description: Additional error details
              example: "Field 'name' is required but was not provided"

  responses:
    BadRequest:
      description: Bad Request - Invalid request data
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Unauthorized - Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "UNAUTHORIZED"
              message: "Authentication required"

    UnprocessableEntity:
      description: Unprocessable Entity - Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: "SERVER_ERROR"
              message: "An unexpected error occurred"

# QUESTIONS FOR BACKEND DEVELOPER:
#
# 1. AUTHENTICATION:
#    - Should backend extract user ID from JWT instead of X-User-Id header?
#    - Which JWT claim to use? (oid, sub, custom claim?)
#    - Should we validate JWT signature on backend?
#
# 2. BUSINESS RULES:
#    - One entity per user, or allow multiple?
#    - If one, should we return 409 Conflict or just return existing?
#    - Any other validation rules needed?
#
# 3. DATA STRUCTURE:
#    - Is this entity schema correct for Azure?
#    - Should field names be camelCase or snake_case?
#    - Any additional fields needed?
#    - Any fields that should be removed?
#
# 4. ERROR HANDLING:
#    - Is this error format compatible with your other endpoints?
#    - Should we follow Azure API Management error format?
#    - Any different HTTP status codes preferred?
#
# 5. RESPONSE FORMAT:
#    - GET /user/entities: Return array or single object?
#    - Should timestamps be ISO 8601 strings or Unix timestamps?
#    - Any additional metadata needed in responses?
#
# 6. DATABASE:
#    - What's the Azure database structure for entities?
#    - Are there foreign key constraints we should know about?
#    - Should IDs be UUIDs, integers, or something else?
#
# PLEASE PROVIDE FEEDBACK SO WE CAN ALIGN!
